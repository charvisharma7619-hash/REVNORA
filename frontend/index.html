<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#080510"><title>REVNORA</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="//libtl.com/sdk.js" data-zone="12170892" data-sdk="show_12170892"></script><style>
*{box-sizing:border-box}body{margin:0;background:#080510;color:white;font:15px Arial;background-image:radial-gradient(circle at 15% 10%,#54128b55,transparent 35%)}main{max-width:500px;margin:auto;padding:20px 16px}.logo{font-size:28px;font-weight:900;letter-spacing:3px;color:#d9aaff}.muted{color:#aa9bb9;font-size:13px}.panel,.card{background:#171024;border:1px solid #67368a;border-radius:17px;padding:17px;margin:13px 0}.balance{font-size:35px;color:#ffd65a;font-weight:bold;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{color:white;text-align:left;cursor:pointer;margin:0}.card b{display:block;margin:8px 0}.btn{background:#963bd1;color:white;border:0;border-radius:10px;padding:12px 15px;font-weight:bold;margin:5px 0;cursor:pointer}.field{display:block;width:100%;padding:12px;background:#0c0814;color:white;border:1px solid #67417f;border-radius:9px;margin:8px 0}.task{padding:12px 0;border-bottom:1px solid #493056}.row{display:flex;justify-content:space-between;gap:8px}.hidden{display:none}.status{white-space:pre-wrap;color:#ffcf79;font-size:13px;margin:10px 0}h2{font-size:18px}.back{background:#342440}.footer{text-align:center;color:#776887;font-size:10px;margin:30px}
</style></head><body><main><header class="row"><div><div class="logo">REVNORA</div><small class="muted">WATCH • EARN • REPEAT</small></div><span style="color:#7dffb2">● ONLINE</span></header>
<div id="home"><h2 id="welcome">Welcome to REVNORA 👋</h2><p class="muted">Your Global Rewards Network</p><div class="panel"><small class="muted">TOTAL BALANCE</small><div class="balance" id="balance">— COINS</div><small class="muted">Complete tasks and earn more</small></div><h2>Explore & Earn</h2><div class="grid">
<button class="card" onclick="page('tasks')">🌐<b>Website Tasks</b><small class="muted">Available tasks</small></button><button class="card" onclick="daily()">🎁<b>Daily Bonus</b><small class="muted">Claim 10 coins</small></button><button class="card" onclick="page('referral')">👥<b>Refer & Earn</b><small class="muted">Invite friends</small></button><button class="card" onclick="page('withdraw')">💸<b>Withdraw</b><small class="muted">Request rewards</small></button><button class="card" onclick="page('ads')">📺<b>Watch Ads</b><small class="muted">Watch rewarded ads</small></button><button class="card" onclick="page('history')">📜<b>Transactions</b><small class="muted">Coin history</small></button><button class="card" onclick="page('profile')">👤<b>My Profile</b><small class="muted">Account details</small></button></div><div id="homeStatus" class="status"></div></div>
<div id="sub" class="hidden"><button class="btn back" onclick="home()">← Back</button><div id="content"></div></div><div class="footer">REVNORA © 2026 • GLOBAL REWARDS NETWORK</div></main>
<script>
const API='https://revnora-backend.charvisharma7619.workers.dev',tg=window.Telegram?.WebApp,init=tg?.initData;tg?.ready();tg?.expand();
function readTelegramUser(){if(tg?.initDataUnsafe?.user)return tg.initDataUnsafe.user;try{const raw=new URLSearchParams(init||'').get('user');return raw?JSON.parse(raw):null}catch{return null}}
const user=readTelegramUser();
function requireUser(target){if(user?.id)return true;const msg='Telegram user details nahi mile. REVNORA bot ke Menu se Mini App open karein.';if(target&&el(target))say(target,msg);else if(el('content'))el('content').textContent=msg;return false}
const headers={'Content-Type':'application/json','X-Telegram-Init-Data':init||''};
async function call(path,body){let r=await fetch(API+path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d}
const el=id=>document.getElementById(id),say=(id,s)=>el(id).textContent=s;
async function start(){try{if(!init||!requireUser('homeStatus'))throw Error('Please open this app from the REVNORA Telegram bot.');say('welcome','Welcome, '+(user.first_name||'User')+' 👋');await call('/api/register',{telegram_id:user.id,username:user.username||'',first_name:user.first_name||'',referral_code:new URLSearchParams(location.search).get('startapp')||''});await balance()}catch(e){say('homeStatus',e.message)}}
async function balance(){try{if(!requireUser('homeStatus'))return;let d=await call('/api/balance/'+user.id);say('balance',Number(d.coins).toLocaleString()+' COINS')}catch(e){say('homeStatus',e.message)}}
async function daily(){try{if(!requireUser('homeStatus'))return;let d=await call('/api/daily/'+user.id,{});say('homeStatus',d.message+' (+'+d.reward+' coins)');balance()}catch(e){say('homeStatus',e.message)}}
function page(p){el('home').classList.add('hidden');el('sub').classList.remove('hidden');let c=el('content');c.innerHTML='';if(p==='tasks')tasks(c);if(p==='referral')referral(c);if(p==='withdraw')withdraw(c);if(p==='history')history(c);if(p==='profile')profile(c);if(p==='ads')ads(c)}
function home(){el('sub').classList.add('hidden');el('home').classList.remove('hidden');balance()}
async function tasks(c){c.innerHTML='<h2>Website Tasks</h2><div class="panel" id="list">Loading…</div>';try{let d=await call('/api/tasks'),l=el('list');l.innerHTML=d.tasks.length?d.tasks.map(t=>'<div class="task"><div class="row"><b>'+esc(t.title)+'</b><b style="color:#ffd65a">+'+t.reward_coins+'</b></div><p class="muted">'+esc(t.description||'')+'</p>'+(t.target_url?'<button class="btn" onclick="window.open('+JSON.stringify(t.target_url)+',\'_blank\')">Open task</button>':'')+'</div>').join(''):'No active tasks right now.'}catch(e){el('list').textContent=e.message}}
async function referral(c){c.innerHTML='<h2>Refer & Earn</h2><div class="panel" id="ref">Loading…</div>';if(!requireUser('ref'))return;try{let d=await call('/api/referral/'+user.id);el('ref').innerHTML='<p>Your referral code</p><h2>'+esc(d.referral_code)+'</h2><p>Successful referrals: '+d.total_referrals+'</p><button class="btn" onclick="navigator.clipboard.writeText('+JSON.stringify(d.referral_code)+')">Copy code</button><p class="muted">Share this code with friends. Referral rewards depend on active program rules.</p>'}catch(e){el('ref').textContent=e.message}}
function withdraw(c){c.innerHTML='<h2>Withdraw coins</h2><div class="panel"><p class="muted">India: 1000 coins = ₹50 • Other countries: 1000 coins = $1</p><input class="field" id="amount" type="number" min="1" placeholder="Amount in coins"><select class="field" id="method" onchange="updatePaymentHint()"><option value="">Payment method</option><option value="UPI">UPI</option><option value="Paytm">Paytm</option><option value="Bank Transfer">Bank Transfer</option><option value="PayPal">PayPal</option><option value="Trust Wallet">Trust Wallet</option><option value="Binance">Binance</option></select><input class="field" id="details" placeholder="Payment details"><small class="muted" id="paymentHint">Choose a payment method to see what details are needed.</small><button class="btn" onclick="submitWithdraw()">Submit request</button><div id="wstatus" class="status"></div></div>'}
function updatePaymentHint(){const m=el('method').value,hints={'UPI':'Enter your UPI ID (example: name@bank)','Paytm':'Enter your Paytm-registered mobile number','Bank Transfer':'Enter account holder name, account number and IFSC','PayPal':'Enter your PayPal email address','Trust Wallet':'Enter your wallet address and network (e.g. USDT-TRC20)','Binance':'Enter your Binance Pay ID or deposit address and network'};el('details').placeholder=hints[m]||'Payment details';say('paymentHint',hints[m]||'Choose a payment method to see what details are needed.');}
async function submitWithdraw(){try{let amount=Number(el('amount').value),payment_method=el('method').value,payment_details=el('details').value.trim();if(!Number.isInteger(amount)||amount<1||!payment_method||!payment_details)throw Error('Enter valid withdrawal details.');let d=await call('/api/withdraw',{telegram_id:user.id,amount,payment_method,payment_details});say('wstatus',d.message);balance()}catch(e){say('wstatus',e.message)}}
function ads(c){c.innerHTML='<h2>Watch Ads</h2><div class="panel"><p>Watch a Monetag rewarded ad and wait for its server confirmation.</p><button class="btn" id="watchAdBtn" onclick="watchAd()">▶ Watch Ad</button><div id="adStatus" class="status"></div></div>'}
async function watchAd(){const btn=el('watchAdBtn');try{if(!requireUser('adStatus'))return;btn.disabled=true;say('adStatus','');const d=await call('/api/ads/start',{telegram_id:user.id});if(typeof window.show_12170892!=='function')throw Error('Monetag SDK load nahi hua. Page refresh karke dobara try karein.');await window.show_12170892({ymid:d.ymid,requestVar:'watch_ads'});say('adStatus','');let tries=0,networkErrors=0;const check=async()=>{try{const st=await call('/api/ads/status/'+encodeURIComponent(d.ymid));networkErrors=0;if(st.ad_status==='valued'){say('adStatus','Reward Granted');await balance();return}if(++tries<24){setTimeout(check,5000)}else say('adStatus','Reward confirmation nahi mila.');}catch(e){networkErrors++;if(networkErrors<6){setTimeout(check,5000)}else say('adStatus','Server connection error. Please try again.')}};setTimeout(check,3000)}catch(e){say('adStatus',e.message||'Ad start nahi ho paya.')}finally{btn.disabled=false}}
async function history(c){c.innerHTML='<h2>Transactions</h2><div class="panel" id="hist">Loading…</div>';if(!requireUser('hist'))return;try{let d=await call('/api/transactions/'+user.id);el('hist').innerHTML=d.transactions.length?d.transactions.map(t=>'<div class="task row"><span>'+esc(t.description||t.transaction_type)+'<br><small class="muted">'+esc(t.created_at||'')+'</small></span><b>'+((t.amount>0)?'+':'')+t.amount+'</b></div>').join(''):'No transactions yet.'}catch(e){el('hist').textContent=e.message}}
function profile(c){if(!requireUser())return;c.innerHTML='<h2>My Profile</h2><div class="panel"><p>Name: '+esc(user.first_name||'')+'</p><p>Username: @'+esc(user.username||'—')+'</p><p>Telegram ID: '+user.id+'</p></div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
start();
</script></body></html>
